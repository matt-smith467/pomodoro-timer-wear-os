name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Format Check
      run: ./gradlew spotlessCheck --configuration-cache

    - name: Run Full Lint Check
      run: ./gradlew lint --configuration-cache

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --configuration-cache

    - name: Build Debug APK
      run: ./gradlew assembleDebug --configuration-cache --scan
