name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Only run if triggered by a tag or a manual dispatch
    if: >
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Verify CI Status on Main
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Verifying latest 'Android CI' status on main..."
        # Get the status/conclusion of the absolute latest run on main
        LATEST_RUN=$(gh run list --workflow "Android CI" --branch main --limit 1 --json status,conclusion)
        STATUS=$(echo $LATEST_RUN | jq -r '.[0].status')
        CONCLUSION=$(echo $LATEST_RUN | jq -r '.[0].conclusion')
        
        echo "Latest run status: $STATUS"
        echo "Latest run conclusion: $CONCLUSION"

        if [ "$STATUS" != "completed" ]; then
          echo "❌ The latest CI run on main is still '$STATUS'. Please wait for it to finish."
          exit 1
        fi

        if [ "$CONCLUSION" != "success" ]; then
          echo "❌ The latest CI run on main failed ('$CONCLUSION'). Release aborted."
          exit 1
        fi
        echo "✅ CI on main is green."

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: wrapper

    - name: Set Version (Manual only)
      if: github.event_name == 'workflow_dispatch'
      run: |
        sed -i "s/versionName = .*/versionName = \"${{ github.event.inputs.versionName }}\"/" app/build.gradle.kts

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release Bundle (AAB)
      run: ./gradlew :app:bundleRelease --configuration-cache

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease --configuration-cache

    - name: Sign Artifacts
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Sign AAB
      uses: r0adkll/sign-android-release@v1
      id: sign_aab
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          ${{ steps.sign_aab.outputs.signedReleaseFile }}
          ${{ steps.sign_app.outputs.signedReleaseFile }}

    - name: Set Release Tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "tag_name=v${{ github.event.inputs.versionName }}" >> $GITHUB_OUTPUT
        else
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        files: |
          ${{ steps.sign_aab.outputs.signedReleaseFile }}
          ${{ steps.sign_app.outputs.signedReleaseFile }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
