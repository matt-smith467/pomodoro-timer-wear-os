name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
  workflow_run:
    workflows: ["Android CI"]
    branches: [main]
    types:
      - completed

jobs:
  release:
    # Only run if triggered by a tag, a manual dispatch, OR a successful Android CI run
    if: >
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify CI Status on Main
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Checking latest 'Android CI' run on main..."
        CONCLUSION=$(gh run list --workflow "Android CI" --branch main --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
        
        if [ "$CONCLUSION" != "success" ]; then
          echo "❌ The latest CI run on main was '$CONCLUSION'. Release aborted."
          echo "Please ensure the latest build on main is passing before releasing."
          exit 1
        fi
        echo "✅ Latest CI on main passed."

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set Version (Manual only)
      if: github.event_name == 'workflow_dispatch'
      run: |
        sed -i "s/versionName = .*/versionName = \"${{ github.event.inputs.versionName }}\"/" app/build.gradle.kts

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release Bundle (AAB)
      run: ./gradlew :app:bundleRelease

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
