name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version Name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'

jobs:
  release:
    # Only run if triggered by a tag or a manual dispatch
    if: >
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify CI Status on Main
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Verifying latest 'Android CI' status on main..."
        # Get the status/conclusion of the absolute latest run on main
        LATEST_RUN=$(gh run list --workflow "Android CI" --branch main --limit 1 --json status,conclusion)
        STATUS=$(echo $LATEST_RUN | jq -r '.[0].status')
        CONCLUSION=$(echo $LATEST_RUN | jq -r '.[0].conclusion')
        
        echo "Latest run status: $STATUS"
        echo "Latest run conclusion: $CONCLUSION"

        if [ "$STATUS" != "completed" ]; then
          echo "❌ The latest CI run on main is still '$STATUS'. Please wait for it to finish."
          exit 1
        fi

        if [ "$CONCLUSION" != "success" ]; then
          echo "❌ The latest CI run on main failed ('$CONCLUSION'). Release aborted."
          exit 1
        fi
        echo "✅ CI on main is green."

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set Version (Manual only)
      if: github.event_name == 'workflow_dispatch'
      run: |
        sed -i "s/versionName = .*/versionName = \"${{ github.event.inputs.versionName }}\"/" app/build.gradle.kts

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release Bundle (AAB)
      run: ./gradlew :app:bundleRelease

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
